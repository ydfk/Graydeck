name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/graydeck:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/graydeck:latest

  github-release:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate version tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build standalone binaries
        run: |
          pnpm run build:standalone -- --target=linux-amd64 --version="${{ steps.version.outputs.value }}"
          pnpm run build:standalone -- --target=windows-amd64 --version="${{ steps.version.outputs.value }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/graydeck-linux-amd64 dist/graydeck-windows-amd64.exe --repo "${GITHUB_REPOSITORY}" --clobber
