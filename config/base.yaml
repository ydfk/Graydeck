# Graydeck 自动注入的基础配置
mixed-port: 17890
socks-port: 17891
redir-port: 17892
tproxy-port: 17893
bind-address: "0.0.0.0"
external-controller: "127.0.0.1:19090"
secret: "graydeck-secret"
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  listen: 0.0.0.0:53
tun:
  enable: true
  stack: system
  device: mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
